<body>
<header>
  <h1>Circuit Reversal Rank</h1>
  <span class="hdr-q">γ(G) ≥ <em>cycle rank</em> always (Prop 1). Equality holds for planar graphs (faces) and K<sub>n</sub> (triangles). When does it fail?</span>
</header>

<div class="content">
  <div class="graph-col">
    <svg id="graph-svg" width="290" height="230"></svg>
    <div id="graph-caption" class="graph-caption"></div>
  </div>

  <div class="main-col">
    <div class="graph-tabs">
      <button class="gtab active fails" data-gid="k33" onclick="switchGraph('k33')">K(3,3) — bound fails</button>
      <button class="gtab fails" data-gid="k34" onclick="switchGraph('k34')">K(3,4) — bound fails</button>
      <button class="gtab holds" data-gid="k5" onclick="switchGraph('k5')">K₅ — bound holds</button>
    </div>

    <div class="metric">
      <div class="metric-num num-far" id="metric-num">—</div>
      <div class="metric-right">
        <div class="metric-label" id="metric-label"></div>

        <div class="metric-actions" id="metric-actions"></div>
      </div>
    </div>

    <div class="grids" id="grids-container"></div>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── Generic graph math ────────────────────────────────────────
function makeEIDX(edges){
  const idx={};
  edges.forEach(([u,v],k)=>{idx[`${u},${v}`]=k;idx[`${v},${u}`]=k;});
  return idx;
}
function makeAdj(o,edges,nv){
  const a=Array.from({length:nv},()=>[]);
  edges.forEach(([u,v],k)=>(o>>k)&1?a[v].push(u):a[u].push(v));
  return a;
}
function reach(a,s,d){
  if(s===d)return true;
  const vis=new Set([s]),q=[s];
  while(q.length){const n=q.shift();for(const nb of a[n]){if(nb===d)return true;if(!vis.has(nb)){vis.add(nb);q.push(nb);}}}
  return false;
}
function isTCO(o,edges,nv){
  const a=makeAdj(o,edges,nv);
  for(let k=0;k<edges.length;k++){
    const[u,v]=edges[k],[s,d]=(o>>k)&1?[v,u]:[u,v];
    if(!reach(a,d,s))return false;
  }
  return true;
}
function cycleMask(verts,eidx){
  let m=0,n=verts.length;
  for(let i=0;i<n;i++)m|=1<<eidx[`${verts[i]},${verts[(i+1)%n]}`];
  return m;
}
function findCycles(o,edges,nv){
  const a=makeAdj(o,edges,nv),found=[],seen=new Set();
  function dfs(st,cur,path,vis){
    for(const nb of a[cur]){
      if(nb===st&&path.length>1){const k=path.join(',');if(!seen.has(k)){seen.add(k);found.push([...path]);}}
      else if(!vis.has(nb)&&nb>st){vis.add(nb);path.push(nb);dfs(st,nb,path,vis);path.pop();vis.delete(nb);}
    }
  }
  for(let s=0;s<nv;s++)dfs(s,s,[s],new Set([s]));
  return found;
}

// ── Precompute ────────────────────────────────────────────────
function precompute(G){
  const{edges,nv,ne}=G;
  G.eidx=makeEIDX(edges);
  G.tcos=[];
  for(let o=0;o<(1<<ne);o++)if(isTCO(o,edges,nv))G.tcos.push(o);
  G.tcoSet=new Set(G.tcos);
  G.tcoIdx=new Map(G.tcos.map((o,i)=>[o,i]));
  G.N=G.tcos.length;

  G.allMasks=new Map();
  const avail=new Map(G.tcos.map(o=>[o,new Set()]));
  for(const o of G.tcos){
    for(const c of findCycles(o,edges,nv)){
      const m=cycleMask(c,G.eidx);
      if(!G.allMasks.has(m))G.allMasks.set(m,c);
      avail.get(o).add(m);
    }
  }

  G.maskList=[...G.allMasks.keys()];
  G.maskIdx=new Map(G.maskList.map((m,i)=>[m,i]));
  G.edgesByMask=G.maskList.map(()=>[]);
  for(const o of G.tcos){
    for(const m of avail.get(o)){
      const nb=o^m;
      if(G.tcoSet.has(nb)&&nb!==o&&G.tcoIdx.get(o)<G.tcoIdx.get(nb)){
        G.edgesByMask[G.maskIdx.get(m)].push([G.tcoIdx.get(o),G.tcoIdx.get(nb)]);
      }
    }
  }
  G.edgesByMask=G.edgesByMask.map(arr=>{
    const seen=new Set();
    return arr.filter(([u,v])=>{const k=u*10000+v;if(seen.has(k))return false;seen.add(k);return true;});
  });
  G.target=countComps(G,G.maskList);
}

function countComps(G,selMasks){
  const N=G.N,parent=Array.from({length:N},(_,i)=>i);
  function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;}
  function union(a,b){a=find(a);b=find(b);if(a!==b)parent[a]=b;}
  for(const m of selMasks){
    const mi=G.maskIdx.get(m);
    if(mi===undefined)continue;
    for(const[u,v]of G.edgesByMask[mi])union(u,v);
  }
  return G.tcos.filter((_,i)=>find(i)===i).length;
}

// ── Graph configurations ──────────────────────────────────────
const GRAPHS={
  k33:{
    name:'K(3,3)', nv:6, ne:9,
    edges:[[0,3],[0,4],[0,5],[1,3],[1,4],[1,5],[2,3],[2,4],[2,5]],
    nodePos:{0:{x:35,y:42},3:{x:148,y:42},1:{x:260,y:42},4:{x:35,y:188},2:{x:148,y:188},5:{x:260,y:188}},
    nodeLabels:['L₀','L₁','L₂','R₀','R₁','R₂'],
    nodeColor:v=>v<3?'#3fb950':'#79c0ff',
    cycleRank:4, tryN:4, minimalN:5,
    svgW:290, svgH:230,
    border:{x:18,y:24,w:253,h:182},
  },
  k34:{
    name:'K(3,4)', nv:7, ne:12,
    edges:[[0,3],[0,4],[0,5],[0,6],[1,3],[1,4],[1,5],[1,6],[2,3],[2,4],[2,5],[2,6]],
    nodePos:{
      0:{x:65,y:55},1:{x:65,y:115},2:{x:65,y:175},
      3:{x:225,y:28},4:{x:225,y:82},5:{x:225,y:137},6:{x:225,y:190}
    },
    nodeLabels:['L₀','L₁','L₂','R₀','R₁','R₂','R₃'],
    nodeColor:v=>v<3?'#3fb950':'#79c0ff',
    cycleRank:6, tryN:6, minimalN:8,
    svgW:290, svgH:230,
    border:{x:18,y:18,w:253,h:194},
  },
  k5:{
    name:'K₅', nv:5, ne:10,
    edges:[[0,1],[0,2],[0,3],[0,4],[1,2],[1,3],[1,4],[2,3],[2,4],[3,4]],
    nodePos:{0:{x:145,y:28},1:{x:258,y:110},2:{x:210,y:205},3:{x:80,y:205},4:{x:32,y:110}},
    nodeLabels:['0','1','2','3','4'],
    nodeColor:()=>'#d2a8ff',
    cycleRank:6, tryN:5, minimalN:6,
    svgW:290, svgH:230,
    border:null,
  }
};

// ── State ─────────────────────────────────────────────────────
let activeId='k33';
let customSel=new Set();

// ── SVG rendering ─────────────────────────────────────────────
function renderSVG(G,hlMask){
  const svg=d3.select('#graph-svg').attr('width',G.svgW).attr('height',G.svgH);
  svg.selectAll('*').remove();
  const defs=svg.append('defs');
  ['dim','hl'].forEach(id=>{
    defs.append('marker').attr('id',`ar-${id}`).attr('viewBox','0 -4 9 8').attr('refX',9).attr('refY',0)
      .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
      .append('path').attr('d','M0,-4L9,0L0,4Z').attr('fill',id==='hl'?'#ffa657':'#3a4450');
  });
  if(G.border){
    const b=G.border;
    svg.append('rect').attr('x',b.x).attr('y',b.y).attr('width',b.w).attr('height',b.h)
      .attr('fill','none').attr('stroke','#1e2530').attr('stroke-width',1).attr('rx',2);
  }
  const refO=G.tcos[0];
  const np=G.nodePos;
  function edgePts(k){
    const[u,v]=G.edges[k],rev=(refO>>k)&1,[s,d]=rev?[v,u]:[u,v];
    const{x:x1,y:y1}=np[s],{x:x2,y:y2}=np[d];
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
    return{x1:x1+13*dx/len,y1:y1+13*dy/len,x2:x2-20*dx/len,y2:y2-20*dy/len};
  }
  const eG=svg.append('g');
  eG.selectAll('line').data(d3.range(G.ne)).join('line')
    .each(function(k){const p=edgePts(k);d3.select(this).attr('x1',p.x1).attr('y1',p.y1).attr('x2',p.x2).attr('y2',p.y2);})
    .attr('stroke',k=>hlMask&&(hlMask>>k)&1?'#ffa657':'#3a4450')
    .attr('stroke-width',k=>hlMask&&(hlMask>>k)&1?2.5:1.5)
    .attr('marker-end',k=>`url(#${hlMask&&(hlMask>>k)&1?'ar-hl':'ar-dim'})`)
    .attr('fill','none');
  const nG=svg.append('g');
  nG.selectAll('circle').data(d3.range(G.nv)).join('circle')
    .attr('cx',d=>np[d].x).attr('cy',d=>np[d].y).attr('r',13)
    .attr('fill','#0d1117').attr('stroke',G.nodeColor).attr('stroke-width',1.5);
  nG.selectAll('text').data(d3.range(G.nv)).join('text')
    .attr('x',d=>np[d].x).attr('y',d=>np[d].y+1)
    .attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('font-size',8).attr('font-family','monospace')
    .attr('fill',G.nodeColor).attr('pointer-events','none')
    .text(d=>G.nodeLabels[d]);
}

// ── Meter ─────────────────────────────────────────────────────
function updateMeter(){
  const G=GRAPHS[activeId];
  const n=customSel.size;
  const nc=n===0?G.target:countComps(G,[...customSel]);
  const el=document.getElementById('metric-num');
  el.textContent=n===0?'—':nc;
  el.className='metric-num '+(nc===G.target?'num-good':nc<=G.target*2?'num-close':'num-far');
  document.getElementById('metric-label').innerHTML=
    `groups out of ${G.target} &nbsp;(<strong>${n}</strong> circuits selected)`;
  const st=document.getElementById('metric-status');
  if(n===0){
    st.style.color='#484f58';
    st.textContent=`No circuits selected — try "${activeId==='k33'?'Try 4 (cycle rank)':'Try 5 (cycle rank−1)'}" to start.`;
  } else if(nc===G.target&&n<=G.minimalN){
    st.style.color='#7ee787';
    st.textContent=`✓ Minimal generating set — ${n} circuits suffice. Minimum = ${n}.`;
  } else if(nc===G.target){
    st.style.color='#7ee787';
    st.textContent=`✓ Generating set: ${n} circuits preserve all ${G.target} groups.`;
  } else if(activeId==='k34'&&n===6){
    st.style.color='#ffa657';
    st.textContent=`6 circuits (cycle rank) → ${nc} groups, need ${G.target}. Cycle rank isn't enough. Minimum = 8.`;
  } else if(activeId==='k33'&&n===4){
    st.style.color='#ffa657';
    st.textContent=`4 circuits (cycle rank) → ${nc} groups, need ${G.target}. Cycle rank isn't enough. Try 5.`;
  } else if(activeId==='k5'&&n===5){
    st.style.color='#ffa657';
    st.textContent=`5 circuits (cycle rank−1) → ${nc} groups, need ${G.target}. Need one more.`;
  } else {
    st.style.color='#8b949e';
    st.textContent=`${n} circuit${n===1?'':'s'} → ${nc} groups. Some TCOs in the same class can't reach each other.`;
  }
}

// ── Grid builders ─────────────────────────────────────────────
function buildGrid(){
  const G=GRAPHS[activeId];
  const container=document.getElementById('grids-container');
  container.innerHTML='';
  if(activeId==='k33') buildK33Grid(G,container);
  else if(activeId==='k34') buildK34Grid(G,container);
  else buildK5Grid(G,container);
  container.appendChild(buildFindingBox());
}

function makeCell(m,label,tooltip,G,extraClass=''){
  const cell=document.createElement('div');
  cell.className='cyc-cell'+extraClass;
  cell.dataset.mask=m;
  cell.innerHTML=label;
  cell.title=tooltip;
  cell.onclick=()=>{
    customSel.has(m)?customSel.delete(m):customSel.add(m);
    cell.classList.toggle('on',customSel.has(m));
    updateMeter();
  };
  cell.onmouseenter=()=>renderSVG(G,m);
  cell.onmouseleave=()=>renderSVG(G,null);
  return cell;
}

function buildK33Grid(G,container){
  const LEFT_PAIRS=[[0,1],[0,2],[1,2]];
  const RIGHT_PAIRS=[[3,4],[3,5],[4,5]];
  const rowLabels=['L₀L₁','L₀L₂','L₁L₂'];

  const c4sec=document.createElement('div');c4sec.className='grid-section';
  c4sec.innerHTML='<h3>4-cycles (C₄) — 9 total, indexed by left × right vertex pairs</h3>';
  const tbl=document.createElement('div');tbl.className='c4-table';
  // header row
  tbl.appendChild(Object.assign(document.createElement('div'),{textContent:''}));
  ['R₀R₁','R₀R₂','R₁R₂'].forEach(t=>{
    const d=document.createElement('div');d.className='c4-ax';d.textContent=t;tbl.appendChild(d);
  });
  // rows
  LEFT_PAIRS.forEach((lp,r)=>{
    const ax=document.createElement('div');ax.className='c4-row-ax';ax.textContent=rowLabels[r];tbl.appendChild(ax);
    RIGHT_PAIRS.forEach((rp,c)=>{
      let m=null;
      for(const[mk,cv]of G.allMasks)
        if(cv.length===4&&lp.every(v=>cv.includes(v))&&rp.every(v=>cv.includes(v))){m=mk;break;}
      const label=`${rowLabels[r]}<br>R${rp.map(v=>v-3).join('')}`;
      const tip='C₄: '+G.allMasks.get(m).map(v=>G.nodeLabels[v]).join('–');
      tbl.appendChild(makeCell(m,label,tip,G));
    });
  });
  c4sec.appendChild(tbl);container.appendChild(c4sec);

  const FACES=[[0,3,2,4,1,5],[3,0,4,2,5,1],[4,0,5,2,3,1]];
  const FACE_SET=new Set(FACES.map(f=>cycleMask(f,G.eidx)));
  const hexMasks=[...G.allMasks.keys()].filter(m=>G.allMasks.get(m).length===6);
  const hexsec=document.createElement('div');hexsec.className='grid-section';
  hexsec.innerHTML='<h3>6-cycles (C₆) — 6 total &nbsp;&nbsp; ⬡ = torus face</h3>';
  const hexrow=document.createElement('div');hexrow.className='hex-row';
  hexMasks.forEach(m=>{
    const isFace=FACE_SET.has(m);
    const tip=(isFace?'[torus face] ':'')+G.allMasks.get(m).map(v=>G.nodeLabels[v]).join('–');
    hexrow.appendChild(makeCell(m,isFace?'⬡<br>face':'C₆',tip,G,' hex'));
  });
  hexsec.appendChild(hexrow);container.appendChild(hexsec);
}

function buildK5Grid(G,container){
  const triMasks=[...G.allMasks.keys()].filter(m=>G.allMasks.get(m).length===3);
  const otherMasks=[...G.allMasks.keys()].filter(m=>G.allMasks.get(m).length!==3);

  const trisec=document.createElement('div');trisec.className='grid-section';
  trisec.innerHTML='<h3>Triangles (C₃) — 10 total — the only cycles that appear in minimal sets</h3>';
  const trigrid=document.createElement('div');trigrid.className='tri-grid';
  triMasks.forEach(m=>{
    const verts=G.allMasks.get(m);
    const label=verts.join('·');
    const tip='Triangle: '+verts.join('–');
    trigrid.appendChild(makeCell(m,label,tip,G));
  });
  trisec.appendChild(trigrid);container.appendChild(trisec);

  const othsec=document.createElement('div');othsec.className='grid-section';
  othsec.innerHTML='<h3>Other cycles (C₄ + C₅) — 27 total — never in a minimal set</h3>';
  const othrow=document.createElement('div');othrow.className='other-row';
  otherMasks.forEach(m=>{
    const verts=G.allMasks.get(m);
    const label=`C${verts.length}`;
    const tip=`C${verts.length}: `+verts.join('–');
    othrow.appendChild(makeCell(m,label,tip,G,' dim-type'));
  });
  othsec.appendChild(othrow);container.appendChild(othsec);
}

function buildK34Grid(G,container){
  const LEFT_PAIRS=[[0,1],[0,2],[1,2]];
  const RIGHT_PAIRS=[[3,4],[3,5],[3,6],[4,5],[4,6],[5,6]];
  const rowLabels=['L₀L₁','L₀L₂','L₁L₂'];
  const colLabels=['R₀R₁','R₀R₂','R₀R₃','R₁R₂','R₁R₃','R₂R₃'];

  const c4sec=document.createElement('div');c4sec.className='grid-section';
  c4sec.innerHTML='<h3>4-cycles (C₄) — 18 total — all minimal sets draw from here</h3>';
  const tbl=document.createElement('div');tbl.className='c4-table-wide';
  tbl.appendChild(Object.assign(document.createElement('div'),{textContent:''}));
  colLabels.forEach(t=>{const d=document.createElement('div');d.className='c4-ax';d.style.fontSize='8px';d.textContent=t;tbl.appendChild(d);});
  LEFT_PAIRS.forEach((lp,r)=>{
    const ax=document.createElement('div');ax.className='c4-row-ax';ax.textContent=rowLabels[r];tbl.appendChild(ax);
    RIGHT_PAIRS.forEach((rp,c)=>{
      let m=null;
      for(const[mk,cv]of G.allMasks)
        if(cv.length===4&&lp.every(v=>cv.includes(v))&&rp.every(v=>cv.includes(v))){m=mk;break;}
      const label=`${rowLabels[r]}<br>${colLabels[c]}`;
      const tip='C₄: '+G.allMasks.get(m).map(v=>G.nodeLabels[v]).join('–');
      tbl.appendChild(makeCell(m,label,tip,G));
    });
  });
  c4sec.appendChild(tbl);container.appendChild(c4sec);

  const hexMasks=[...G.allMasks.keys()].filter(m=>G.allMasks.get(m).length===6);
  const hexsec=document.createElement('div');hexsec.className='grid-section';
  hexsec.innerHTML='<h3>6-cycles (C₆) — 24 total — never appear in a minimal generating set</h3>';
  const hexrow=document.createElement('div');hexrow.className='hex-row';
  hexMasks.forEach(m=>{
    const tip='C₆: '+G.allMasks.get(m).map(v=>G.nodeLabels[v]).join('–');
    hexrow.appendChild(makeCell(m,'C₆',tip,G,' hex'));
  });
  hexsec.appendChild(hexrow);container.appendChild(hexsec);
}

  return `<strong>Where each case sits in the paper's Venn diagram:</strong>

  <tr class="${activeId==='k5'?'active':''}"><td${activeId==='k5'?'><strong>K₅</strong>':' class="dim">K₅'}</td><td class="good">✓</td><td class="warn">✗</td><td class="dim">6</td><td class="dim">6</td><td class="dim">0</td><td class="good">Prop 3</td></tr>

// ── Button actions ────────────────────────────────────────────
function buildActions(){
  const G=GRAPHS[activeId];
  const el=document.getElementById('metric-actions');
  el.innerHTML='';
  function btn(label,fn,cls=''){
    const b=document.createElement('button');
    b.className='mact '+cls;b.textContent=label;b.onclick=fn;el.appendChild(b);
  }
  btn('None',()=>{customSel=new Set();syncCells();updateMeter();});
  if(activeId==='k33'){
    btn(`Try 4 (cycle rank)`,()=>selectMasks(tryK33()),'primary');
    btn('Show minimal set (5)',()=>selectMasks(minimalK33()));
  } else if(activeId==='k34'){
    btn('Try 6 (cycle rank)',()=>selectMasks(tryK34()),'primary');
  } else {
    btn('Try 5 (cycle rank−1)',()=>selectMasks(tryK5()),'primary');
    btn('Show minimal set (6)',()=>selectMasks(minimalK5()));
  }
  btn('All',()=>{customSel=new Set(GRAPHS[activeId].maskList);syncCells();updateMeter();});
}

function tryK33(){
  const G=GRAPHS.k33;
  const lp=[[0,1],[0,2],[1,2]],rp=[[3,4],[3,5],[4,5]];
  const ms=[];
  [[0,0],[0,1],[1,0],[1,1]].forEach(([r,c])=>{
    for(const[m,cv]of G.allMasks)
      if(cv.length===4&&lp[r].every(v=>cv.includes(v))&&rp[c].every(v=>cv.includes(v))){ms.push(m);break;}
  });
  return ms;
}
function minimalK33(){
  const G=GRAPHS.k33;
  const lp=[[0,1],[0,2],[1,2]],rp=[[3,4],[3,5],[4,5]];
  const ms=[];
  [[0,0],[0,1],[1,0],[1,1],[2,2]].forEach(([r,c])=>{
    for(const[m,cv]of G.allMasks)
      if(cv.length===4&&lp[r].every(v=>cv.includes(v))&&rp[c].every(v=>cv.includes(v))){ms.push(m);break;}
  });
  return ms;
}
function tryK34(){
  // First row of the C4 grid: L0L1 × all 6 right pairs
  const G=GRAPHS.k34;
  const lp=[0,1];
  const rps=[[3,4],[3,5],[3,6],[4,5],[4,6],[5,6]];
  const ms=[];
  for(const rp of rps)
    for(const[m,cv]of G.allMasks)
      if(cv.length===4&&lp.every(v=>cv.includes(v))&&rp.every(v=>cv.includes(v))){ms.push(m);break;}
  return ms;
}
function tryK5(){
  const G=GRAPHS.k5;
  const tris=[...G.allMasks.keys()].filter(m=>G.allMasks.get(m).length===3);
  return tris.filter(m=>G.allMasks.get(m).includes(0)).slice(0,5);
}
function minimalK5(){
  const G=GRAPHS.k5;
  const tris=[...G.allMasks.keys()].filter(m=>G.allMasks.get(m).length===3);
  return tris.filter(m=>G.allMasks.get(m).includes(0));
}

function selectMasks(ms){
  customSel=new Set(ms);syncCells();updateMeter();
}
function syncCells(){
  document.querySelectorAll('.cyc-cell').forEach(c=>c.classList.toggle('on',customSel.has(+c.dataset.mask)));
}

// ── Switch graph ──────────────────────────────────────────────
function switchGraph(id){
  activeId=id;customSel=new Set();
  document.querySelectorAll('.gtab').forEach(t=>{
    const active=t.dataset.gid===id;
    t.classList.toggle('active',active);
    if(active) t.classList.add((id==='k33'||id==='k34')?'fails':'holds');
  });
  renderSVG(GRAPHS[id],null);
  updateCaption();
  buildGrid();
  buildActions();
  updateMeter();
}

function updateCaption(){
  const G=GRAPHS[activeId];
  const el=document.getElementById('graph-caption');
  if(activeId==='k33'){
    el.innerHTML='<strong>K(3,3) on the torus</strong> — one directed orientation shown.<br>Green = left vertices · Blue = right vertices<br>Hover any cycle cell to highlight its edges.';
  } else if(activeId==='k34'){
    el.innerHTML='<strong>K(3,4)</strong> — complete bipartite graph, one directed orientation shown.<br>Green = left (3) · Blue = right (4)<br>Hover any cycle cell to highlight its edges.';
  } else {
    el.innerHTML='<strong>K₅</strong> — complete graph on 5 vertices, one directed orientation shown.<br>Purple = all vertices (not bipartite)<br>Hover any cycle cell to highlight its edges.';
  }
}
